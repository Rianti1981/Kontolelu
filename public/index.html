<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kontolelu Game</title><style>body{margin:0;font-family:system-ui;background:#111;color:#fff;display:grid;place-items:center;min-height:100vh}.card{text-align:center;background:#1d1d1d;padding:28px;border-radius:24px;max-width:420px;width:85%;box-shadow:0 12px 40px #0008}button{font-size:20px;padding:15px 28px;border:0;border-radius:14px;background:#fff;color:#111}#score{font-size:48px;font-weight:800;margin:20px}</style></head><body><main class="card"><h1>🎮 Kontolelu</h1><p>Klik tombol sebanyak mungkin!</p><div id="score">0</div><button id="btn">KLIK!</button><p id="best">Rekor: 0</p></main><script>let score=0,best=Number(localStorage.bestKontolelu||0);const s=document.querySelector('#score'),b=document.querySelector('#best');b.textContent='Rekor: '+best;document.querySelector('#btn').onclick=()=>{score++;s.textContent=score;if(score>best){best=score;localStorage.bestKontolelu=best;b.textContent='Rekor: '+best}};</script></body></html>
