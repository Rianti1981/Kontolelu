<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tap Rush</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3efe6;color:#252525;font-family:Inter,system-ui,-apple-system,sans-serif;min-height:100vh}.app{width:min(620px,100%);margin:auto;padding:18px 15px 24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.title{font-size:27px;font-weight:900;letter-spacing:-1px}.tag{font-size:12px;font-weight:800;border:2px solid #252525;border-radius:999px;padding:6px 10px;background:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.box{background:#fff;border:2px solid #252525;border-radius:14px;padding:10px 6px;text-align:center;box-shadow:3px 3px 0 #252525}.label{font-size:10px;text-transform:uppercase;font-weight:800;opacity:.58}.num{font-size:22px;font-weight:900;margin-top:2px}.board{position:relative;height:min(62vh,500px);min-height:390px;margin-top:14px;background:#e9e3d7;border:2px solid #252525;border-radius:20px;box-shadow:6px 6px 0 #252525;overflow:hidden}.message{position:absolute;inset:22px 20px auto;text-align:center;font-weight:700;color:#555}.start,.again{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:2px solid #252525;background:#b9e4c9;color:#252525;border-radius:14px;padding:14px 24px;font-size:17px;font-weight:900;box-shadow:4px 4px 0 #252525}.target{display:none;position:absolute;width:78px;height:78px;border:2px solid #252525;border-radius:50%;background:#f6b6c8;box-shadow:4px 4px 0 #252525;touch-action:manipulation}.target:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #252525}.pop{position:absolute;font-weight:900;font-size:22px;pointer-events:none;animation:up .55s ease-out forwards}@keyframes up{to{opacity:0;transform:translateY(-45px)}}.over{display:none;position:absolute;inset:0;background:#f3efe6eF;align-items:center;justify-content:center;text-align:center}.modal{width:82%;background:#fff;border:2px solid #252525;border-radius:18px;padding:24px;box-shadow:6px 6px 0 #252525}.final{font-size:55px;font-weight:950;line-height:1}.again{position:static;transform:none;margin-top:15px;width:100%;background:#b9d8ef}.actions{display:flex;gap:9px;margin-top:14px}.action{flex:1;border:2px solid #252525;border-radius:12px;background:#fff;padding:11px;font-weight:800;box-shadow:3px 3px 0 #252525}.help{margin:14px 2px 0;color:#666;font-size:12px;text-align:center}@media(max-height:650px){.board{min-height:330px;height:55vh}}
</style></head>
<body><main class="app">
<header class="top"><div class="title">Tap Rush</div><div class="tag">ARCADE · v3</div></header>
<section class="stats"><div class="box"><div class="label">Skor</div><div class="num" id="score">0</div></div><div class="box"><div class="label">Level</div><div class="num" id="level">1</div></div><div class="box"><div class="label">Nyawa</div><div class="num" id="lives">3</div></div><div class="box"><div class="label">Rekor</div><div class="num" id="best">0</div></div></section>
<section class="board" id="board"><div class="message" id="message">Klik target sebelum waktunya habis.</div><button class="start" id="start">Mulai</button><button class="target" id="target" aria-label="Target"></button><div class="over" id="over"><div class="modal"><div style="font-weight:900">SELESAI</div><div class="final" id="final">0</div><div id="result">Skor akhir</div><button class="again" id="again">Main lagi</button></div></div></section>
<div class="actions"><button class="action" id="sound">Suara: ON</button><button class="action" id="reset">Reset rekor</button></div><div class="help">Target makin kecil dan makin cepat setiap level.</div>
</main>
<script>
const board=document.querySelector('#board'),target=document.querySelector('#target'),start=document.querySelector('#start'),again=document.querySelector('#again'),over=document.querySelector('#over'),scoreEl=document.querySelector('#score'),levelEl=document.querySelector('#level'),livesEl=document.querySelector('#lives'),bestEl=document.querySelector('#best'),message=document.querySelector('#message'),finalEl=document.querySelector('#final'),result=document.querySelector('#result'),soundBtn=document.querySelector('#sound');
let score=0,level=1,lives=3,running=false,best=Number(localStorage.tapRushBest||0),timer=null,missTimer=null,sound=true,audio=null;bestEl.textContent=best;
function beep(f=600,d=.04){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.035;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function move(){const r=board.getBoundingClientRect(),size=Math.max(48,78-(level-1)*5),x=10+Math.random()*(r.width-size-20),y=65+Math.random()*(r.height-size-82);target.style.width=target.style.height=size+'px';target.style.left=x+'px';target.style.top=y+'px';clearTimeout(missTimer);missTimer=setTimeout(()=>{if(!running)return;lives--;livesEl.textContent=lives;beep(180,.08);if(lives<=0)end();else move()},Math.max(700,1700-level*120))}
function pop(e){const p=document.createElement('div');p.className='pop';p.textContent='+1';p.style.left=(e.clientX-board.getBoundingClientRect().left-8)+'px';p.style.top=(e.clientY-board.getBoundingClientRect().top-20)+'px';board.appendChild(p);setTimeout(()=>p.remove(),550)}
function begin(){score=0;level=1;lives=3;running=true;scoreEl.textContent=0;levelEl.textContent=1;livesEl.textContent=3;start.style.display='none';over.style.display='none';target.style.display='block';message.textContent='Cari target dan klik secepat mungkin.';move();beep(720,.07)}
function end(){running=false;clearTimeout(missTimer);clearInterval(timer);target.style.display='none';over.style.display='flex';finalEl.textContent=score;if(score>best){best=score;localStorage.tapRushBest=best;bestEl.textContent=best;result.textContent='Rekor baru!'}else result.textContent='Rekor: '+best;beep(180,.16)}
target.onclick=e=>{if(!running)return;clearTimeout(missTimer);score++;if(score%7===0)level=Math.min(10,level+1);scoreEl.textContent=score;levelEl.textContent=level;pop(e);beep(480+level*55,.035);move()};start.onclick=begin;again.onclick=begin;soundBtn.onclick=()=>{sound=!sound;soundBtn.textContent='Suara: '+(sound?'ON':'OFF')};document.querySelector('#reset').onclick=()=>{best=0;localStorage.removeItem('tapRushBest');bestEl.textContent=0};window.onresize=()=>{if(running)move()};
</script></body></html>
