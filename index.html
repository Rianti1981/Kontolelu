<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090b18"><title>Kontolelu ⚡</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:#090b18}body{min-height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 0,#28305e 0,#11152d 38%,#090b18 75%)}
.wrap{width:min(560px,100%);min-height:100vh;margin:auto;padding:18px 16px;display:flex;flex-direction:column;gap:14px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:900}.pill{padding:7px 12px;border:1px solid #ffffff22;border-radius:999px;background:#ffffff0c;font-size:13px;color:#cbd0f8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{padding:12px 8px;text-align:center;border-radius:17px;background:#ffffff0d;border:1px solid #ffffff12}.label{font-size:11px;color:#aeb5d9;text-transform:uppercase;letter-spacing:1px}.value{font-size:25px;font-weight:900;margin-top:2px}.arena{position:relative;flex:1;min-height:410px;border-radius:28px;border:1px solid #ffffff16;background:linear-gradient(145deg,#ffffff0d,#ffffff03);box-shadow:inset 0 1px #ffffff0b,0 18px 50px #0007;overflow:hidden}.arena:before,.arena:after{content:"";position:absolute;border-radius:50%;filter:blur(40px);opacity:.25}.arena:before{width:180px;height:180px;background:#6d5dfc;top:-70px;left:-50px}.arena:after{width:180px;height:180px;background:#00d9ff;bottom:-80px;right:-50px}#start{position:absolute;inset:0;margin:auto;width:210px;height:62px;border:0;border-radius:20px;color:#fff;font-size:18px;font-weight:900;background:linear-gradient(135deg,#765cff,#00c8ff);box-shadow:0 12px 35px #00aaff44}.hint{position:absolute;left:0;right:0;top:26px;text-align:center;color:#aeb5d9;font-size:13px}.target{display:none;position:absolute;width:92px;height:92px;border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 5%,#ffd84d 7% 23%,#ff6bcb 24% 55%,#745cff 56%);box-shadow:0 0 0 8px #ffffff0d,0 0 40px #8b72ff99;animation:pulse .55s infinite alternate;touch-action:manipulation}.target:active{transform:scale(.84)}@keyframes pulse{to{filter:brightness(1.25);box-shadow:0 0 0 13px #ffffff08,0 0 55px #9b85ffcc}}.controls{display:flex;gap:9px}.ctrl{flex:1;border:1px solid #ffffff18;background:#ffffff0b;color:#fff;border-radius:15px;padding:12px;font-weight:700}.danger{color:#ffb7c6}.float{position:absolute;pointer-events:none;font-weight:1000;font-size:24px;animation:float .65s ease-out forwards}@keyframes float{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-70px) scale(1.4)}}#gameover{display:none;position:absolute;inset:0;background:#080a16dd;backdrop-filter:blur(8px);align-items:center;justify-content:center;text-align:center;padding:25px}.modal{width:90%;padding:25px;border-radius:25px;background:#171b36;border:1px solid #ffffff18}.big{font-size:46px;font-weight:1000}.again{margin-top:15px;width:100%;padding:14px;border:0;border-radius:15px;font-weight:900;font-size:16px;background:#fff;color:#111}@media(max-height:650px){.arena{min-height:330px}.wrap{padding-top:10px}}
</style></head>
<body><div class="wrap"><div class="top"><div class="brand">KONTOLELU ⚡</div><div class="pill">v2.0 • ARCADE</div></div>
<div class="stats"><div class="stat"><div class="label">Skor</div><div id="score" class="value">0</div></div><div class="stat"><div class="label">Waktu</div><div id="time" class="value">20</div></div><div class="stat"><div class="label">Rekor</div><div id="best" class="value">0</div></div></div>
<div id="arena" class="arena"><div class="hint" id="hint">Siap? Klik target secepat mungkin!</div><button id="start">🚀 MULAI GAME</button><button id="target" class="target" aria-label="Target"></button><div id="gameover"><div class="modal"><div>⏱️ WAKTU HABIS</div><div id="final" class="big">0</div><div id="result">Skor kamu</div><button class="again" id="again">🔥 MAIN LAGI</button></div></div></div>
<div class="controls"><button class="ctrl" id="sound">🔊 Suara: ON</button><button class="ctrl danger" id="reset">♻️ Reset Rekor</button></div></div>
<script>
const arena=document.querySelector('#arena'),target=document.querySelector('#target'),start=document.querySelector('#start'),again=document.querySelector('#again'),over=document.querySelector('#gameover'),scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),bestEl=document.querySelector('#best'),hint=document.querySelector('#hint'),finalEl=document.querySelector('#final'),result=document.querySelector('#result'),soundBtn=document.querySelector('#sound');let score=0,time=20,best=Number(localStorage.getItem('kontoleluBest')||0),running=false,timer=null,sound=true,audio=null;bestEl.textContent=best;
function beep(freq=600,dur=.045){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.04,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function move(){let r=arena.getBoundingClientRect(),size=92,x=8+Math.random()*(r.width-size-16),y=70+Math.random()*(r.height-size-90);target.style.left=x+'px';target.style.top=y+'px'}
function pop(e){let f=document.createElement('div');f.className='float';f.textContent=Math.random()<.18?'🔥 +2':'+1';f.style.left=(e.clientX-arena.getBoundingClientRect().left-10)+'px';f.style.top=(e.clientY-arena.getBoundingClientRect().top-20)+'px';arena.appendChild(f);setTimeout(()=>f.remove(),650)}
function end(){running=false;clearInterval(timer);target.style.display='none';over.style.display='flex';finalEl.textContent=score;if(score>best){best=score;localStorage.setItem('kontoleluBest',best);bestEl.textContent=best;result.textContent='🏆 REKOR BARU!'}else result.textContent='Rekor: '+best;beep(220,.2)}
function begin(){score=0;time=20;scoreEl.textContent=0;timeEl.textContent=20;over.style.display='none';start.style.display='none';hint.textContent='🎯 Cari target dan klik secepat mungkin!';target.style.display='block';running=true;move();beep(700,.08);clearInterval(timer);timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=5)timeEl.style.color='#ff8ca8';else timeEl.style.color='';if(time<=0)end()},1000)}
target.addEventListener('click',e=>{if(!running)return;score++;scoreEl.textContent=score;pop(e);move();beep(500+Math.min(score,20)*25,.035)});start.onclick=begin;again.onclick=begin;soundBtn.onclick=()=>{sound=!sound;soundBtn.textContent=sound?'🔊 Suara: ON':'🔇 Suara: OFF'};document.querySelector('#reset').onclick=()=>{if(confirm('Hapus rekor Kontolelu?')){best=0;localStorage.removeItem('kontoleluBest');bestEl.textContent=0}};window.addEventListener('resize',()=>{if(running)move()});
</script></body></html>
