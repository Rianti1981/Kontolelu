<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar Kehadiran</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;color:#263238;background:#fff7df;min-height:100vh;overflow-x:hidden}body:before,body:after{content:"";position:fixed;border-radius:50%;z-index:-1;opacity:.55}body:before{width:260px;height:260px;background:#ffd6a5;top:-80px;left:-80px}body:after{width:320px;height:320px;background:#cdeccf;right:-110px;bottom:-120px}.app{max-width:760px;margin:auto;padding:24px 16px 40px}.head{background:#fff;border:2px solid #263238;border-radius:20px;padding:22px;box-shadow:6px 6px 0 #263238;margin-bottom:18px}.head h1{margin:0;font-size:30px;letter-spacing:-1px}.head p{margin:6px 0 0;color:#687277}.card{background:#fff;border:2px solid #263238;border-radius:18px;padding:18px;box-shadow:5px 5px 0 #263238;margin-bottom:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:12px;border:2px solid #263238;border-radius:11px;background:#fffdf7;font:inherit}.add{margin-top:12px;width:100%;padding:13px;border:2px solid #263238;border-radius:12px;background:#c9e9d1;font-weight:900;box-shadow:3px 3px 0 #263238}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}.mini{text-align:center;border:2px solid #263238;border-radius:13px;padding:10px;background:#fff}.mini b{display:block;font-size:24px}.student{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #ddd}.student:last-child{border-bottom:0}.name{font-weight:800}.status{display:flex;gap:6px}.status button{border:2px solid #263238;border-radius:9px;padding:8px 10px;background:#fff;font-weight:800}.status .on{background:#c9e9d1}.status .off{background:#ffd0d7}.empty{text-align:center;color:#777;padding:20px}.clear{margin-top:12px;width:100%;padding:11px;border:2px solid #263238;border-radius:11px;background:#fff0b8;font-weight:800}.note{font-size:12px;color:#697278;margin-top:10px}@media(max-width:520px){.row{grid-template-columns:1fr}.student{grid-template-columns:1fr}.status{justify-content:flex-start}.head h1{font-size:26px}}</style></head><body><main class="app"><section class="head"><h1>Daftar Kehadiran</h1><p>Catat kehadiran murid dengan sederhana.</p></section><section class="card"><div class="row"><div class="field"><label>Nama murid</label><input id="name" placeholder="Masukkan nama"></div><div class="field"><label>Tanggal</label><input id="date" type="date"></div></div><button class="add" id="add">Tambah murid</button><div class="note">Data tersimpan otomatis di perangkat ini.</div></section><section class="card"><div class="summary"><div class="mini"><b id="total">0</b>Total</div><div class="mini"><b id="present">0</b>Hadir</div><div class="mini"><b id="absent">0</b>Absen</div></div><div id="list"><div class="empty">Belum ada murid.</div></div><button class="clear" id="clear">Hapus semua data</button></section></main><script>const nameEl=document.querySelector('#name'),dateEl=document.querySelector('#date'),list=document.querySelector('#list'),total=document.querySelector('#total'),present=document.querySelector('#present'),absent=document.querySelector('#absent');dateEl.value=new Date().toISOString().slice(0,10);let data=JSON.parse(localStorage.getItem('attendanceData')||'[]');function save(){localStorage.setItem('attendanceData',JSON.stringify(data))}function render(){list.innerHTML='';let p=0,a=0;if(!data.length)list.innerHTML='<div class="empty">Belum ada murid.</div>';data.forEach((s,i)=>{s.present?p++:a++;const d=document.createElement('div');d.className='student';d.innerHTML='<div><div class="name"></div><small>'+s.date+'</small></div><div class="status"><button class="on">Hadir</button><button class="off">Absen</button></div>';d.querySelector('.name').textContent=s.name;d.querySelector('.on').onclick=()=>{s.present=true;save();render()};d.querySelector('.off').onclick=()=>{s.present=false;save();render()};list.appendChild(d)});total.textContent=data.length;present.textContent=p;absent.textContent=a}document.querySelector('#add').onclick=()=>{const n=nameEl.value.trim();if(!n)return nameEl.focus();data.push({name:n,date:dateEl.value||new Date().toISOString().slice(0,10),present:true});nameEl.value='';save();render()};document.querySelector('#clear').onclick=()=>{if(confirm('Hapus semua data kehadiran?')){data=[];save();render()}};render();</script></body></html>
